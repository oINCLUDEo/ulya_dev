<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Вход через Telegram — Ulya VPN</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: #0A0A0F;
      color: #E8E8F0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
    .wrap { text-align: center; padding: 32px; max-width: 360px; }
    .glow {
      width: 96px; height: 96px; margin: 0 auto 28px;
      border-radius: 28px;
      background: radial-gradient(circle at 50% 40%, rgba(124,107,255,0.35), rgba(124,107,255,0) 70%);
      display: flex; align-items: center; justify-content: center;
    }
    .spinner {
      width: 46px; height: 46px; border-radius: 50%;
      border: 3px solid rgba(124,107,255,0.25);
      border-top-color: #7C6BFF;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 18px; font-weight: 700; margin: 0 0 8px; }
    p  { font-size: 14px; line-height: 1.5; color: #A8A8B8; margin: 0; }
    .err { color: #ff6b6b; }
    .btn {
      display: inline-block; margin-top: 22px; padding: 12px 22px;
      border-radius: 14px; background: #7C6BFF; color: #fff;
      font-weight: 600; font-size: 14px; text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="glow"><div class="spinner"></div></div>
    <h1 id="title">Открываем Telegram…</h1>
    <p id="msg">Подтвердите вход в появившемся окне Telegram.</p>
    <div id="fallback"></div>
  </div>

  <script>
  (function () {
    // ──────────────────────────────────────────────────────────────────────
    // Telegram OAuth bridge for the Ulya VPN mobile app.
    //
    // MUST be hosted on the domain registered in @BotFather (/setdomain) —
    // the trusted origin for oauth.telegram.org. Currently: web.ulya.space.
    //
    // Flow:
    //   1. App opens this page in an in-app browser.
    //   2. We redirect to oauth.telegram.org; the user confirms in Telegram.
    //   3. Telegram redirects back here with the auth result.
    //   4. We hand the result to the app via the ulyavpn:// custom scheme.
    // ──────────────────────────────────────────────────────────────────────
    var BOT_ID = '8762640503';                 // numeric id of @include_project_bot
    var ORIGIN = 'https://web.ulya.space';     // must equal the BotFather domain
    var RETURN = ORIGIN + '/tg-mobile.html';   // this page's own URL
    var APP_CB = 'ulyavpn://oauth/telegram';   // = AppConfig.telegramAuthCallback

    function toApp(qs) {
      try { window.location.replace(APP_CB + qs); }
      catch (e) { window.location.href = APP_CB + qs; }
    }
    function paramsToObject(str) {
      var o = {};
      if (!str) return o;
      str.replace(/^[?#]/, '').split('&').forEach(function (kv) {
        if (!kv) return;
        var i = kv.indexOf('=');
        if (i < 0) { o[decodeURIComponent(kv)] = ''; return; }
        o[decodeURIComponent(kv.slice(0, i))] = decodeURIComponent(kv.slice(i + 1));
      });
      return o;
    }
    function b64urlOfObject(obj) {
      var json = JSON.stringify(obj);
      var b64 = btoa(unescape(encodeURIComponent(json)));
      return b64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }
    function showError() {
      document.getElementById('title').textContent = 'Не удалось войти';
      document.getElementById('title').className = 'err';
      document.getElementById('msg').textContent =
        'Telegram недоступен. Вернитесь в приложение — оно предложит вход через бота.';
      var fb = document.getElementById('fallback');
      fb.innerHTML = '<a class="btn" href="' + APP_CB + '?error=blocked">Вернуться в приложение</a>';
    }

    var hash = window.location.hash || '';
    var search = window.location.search || '';
    var fragO = paramsToObject(hash);
    var qO = paramsToObject(search);

    // ── Returning from Telegram ──────────────────────────────────────────
    // Standard Login Widget redirect: #tgAuthResult=<base64url(json)>
    if (hash.indexOf('tgAuthResult=') !== -1) {
      var r = hash.split('tgAuthResult=')[1].split('&')[0];
      return toApp('?tgAuthResult=' + encodeURIComponent(r));
    }
    // OIDC implicit: id_token in fragment or query
    if (fragO.id_token) return toApp('?id_token=' + encodeURIComponent(fragO.id_token));
    if (qO.id_token)    return toApp('?id_token=' + encodeURIComponent(qO.id_token));
    // Explicit error
    if (qO.error)    return toApp('?error=' + encodeURIComponent(qO.error));
    if (fragO.error) return toApp('?error=' + encodeURIComponent(fragO.error));
    // Widget fields delivered directly as params (redirect mode)
    if (qO.hash && qO.id)       return toApp('?tgAuthResult=' + encodeURIComponent(b64urlOfObject(qO)));
    if (fragO.hash && fragO.id) return toApp('?tgAuthResult=' + encodeURIComponent(b64urlOfObject(fragO)));

    // ── First load → start the Telegram OAuth flow ───────────────────────
    var url = 'https://oauth.telegram.org/auth'
      + '?bot_id=' + encodeURIComponent(BOT_ID)
      + '&origin=' + encodeURIComponent(ORIGIN)
      + '&embed=0'
      + '&request_access=write'
      + '&return_to=' + encodeURIComponent(RETURN);

    // If oauth.telegram.org cannot be reached (blocked), nothing will navigate
    // away — surface a way back to the app after a short grace period.
    var bailout = setTimeout(showError, 12000);
    window.addEventListener('pagehide', function () { clearTimeout(bailout); });

    window.location.replace(url);
  })();
  </script>
</body>
</html>
